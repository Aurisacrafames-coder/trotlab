# Byt app-namn till något unikt, t.ex. trotlab-anders
app = 'trotlab'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[mounts]]
  source = 'trotlab_data'
  destination = '/data'

[vm]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
